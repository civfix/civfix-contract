# Settings only: this repo is one package, so there is no `packages:` list.

nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true
linkWorkspacePackages: true

# A dependency that declares it cannot run on our Node must stop the install, not print a warning CI ignores.
engineStrict: true

# Supply-chain gates (civfix/issue-tracker#259 D11). A version must be a day old before it can resolve, so a
# hijacked publish is usually caught and pulled first. @civfix/* is exempt: it is our own registry. For an
# urgent same-day security fix, add that one package to minimumReleaseAgeExclude; never lower the global age.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@civfix/*"
# Refuse a version published with weaker provenance than the versions before it (a stolen token, not CI).
trustPolicy: no-downgrade
# A git or tarball-URL subdependency carries no publish time or provenance, so it would slip past both checks above.
blockExoticSubdeps: true
# A new install script must stop the install for review: skipped silently, it can also break a native binary unnoticed.
strictDepBuilds: true

# The only packages allowed to run install scripts. esbuild (tsup, vitest) verifies, and if needed fetches, the
# native binary its platform package provides. Add a package here only after reading its script.
allowBuilds:
  esbuild: true
